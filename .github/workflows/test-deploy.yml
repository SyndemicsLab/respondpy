name: Build and Deploy to TestPyPI

on: workflow_dispatch

jobs:
    build_linux_images:
        name: Build ${{ matrix.libc }} ${{ matrix.arch }} image
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - libc: manylinux
                      arch: x86_64
                      runner: ubuntu-latest
                      dockerfile: docker/Dockerfile.manylinux
                      base-image: quay.io/pypa/manylinux_2_28_x86_64
                    - libc: manylinux
                      arch: aarch64
                      runner: ubuntu-24.04-arm
                      dockerfile: docker/Dockerfile.manylinux
                      base-image: quay.io/pypa/manylinux_2_28_aarch64
                    - libc: musllinux
                      arch: x86_64
                      runner: ubuntu-latest
                      dockerfile: docker/Dockerfile.musllinux
                      base-image: quay.io/pypa/musllinux_1_2_x86_64
                    - libc: musllinux
                      arch: aarch64
                      runner: ubuntu-24.04-arm
                      dockerfile: docker/Dockerfile.musllinux
                      base-image: quay.io/pypa/musllinux_1_2_aarch64
        steps:
            - uses: actions/checkout@v6

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  build-args: BASE_IMAGE=${{ matrix.base-image }}
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/respondpy-${{ matrix.libc }}-${{ matrix.arch }}:eigen-3.4.0

    build_wheels:
        name: Build wheels for ${{ matrix.os }}
        needs: build_linux_images
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            packages: read
        strategy:
            matrix:
                # macos-15-intel is an Intel runner, macos-14 is Apple silicon
                os: [
                        ubuntu-latest,
                        ubuntu-24.04-arm,
                        windows-latest,
                        windows-11-arm,
                        # macos-15-intel,
                        # macos-14,
                    ]

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Log in to GHCR for Linux builds
              if: startsWith(matrix.os, 'ubuntu')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Eigen for Windows builds
              if: startsWith(matrix.os, 'windows')
              shell: pwsh
              run: |
                  $triplet = if ("${{ matrix.os }}" -eq "windows-11-arm") { "arm64-windows" } else { "x64-windows" }
                  vcpkg install "eigen3:$triplet"
                  "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet" >> $env:GITHUB_ENV

            - name: Build wheels
              uses: pypa/cibuildwheel@v3.4.0
              env:
                  CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/${{ github.repository_owner }}/respondpy-manylinux-x86_64:eigen-3.4.0
                  CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/${{ github.repository_owner }}/respondpy-manylinux-aarch64:eigen-3.4.0
                  CIBW_MUSLLINUX_X86_64_IMAGE: ghcr.io/${{ github.repository_owner }}/respondpy-musllinux-x86_64:eigen-3.4.0
                  CIBW_MUSLLINUX_AARCH64_IMAGE: ghcr.io/${{ github.repository_owner }}/respondpy-musllinux-aarch64:eigen-3.4.0
              with:
                  extras: "uv"

            - uses: actions/upload-artifact@v4
              with:
                  name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    build_sdist:
        name: Build Source Distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
              with:
                  version: "0.11.20"

            - name: Build sdist
              run: uvx --from build pyproject-build
            - uses: actions/upload-artifact@v4
              with:
                  name: cibw-sdist
                  path: dist/*.tar.gz

    upload_pypi:
        name: Publish to PyPI
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        environment:
            name: testpypi
        permissions:
            id-token: write
        steps:
            - name: Download wheel artifacts
              uses: actions/download-artifact@v5
              with:
                  path: dist
                  pattern: cibw-*
                  merge-multiple: true

            - name: Publish distributions to PyPI with attestations
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  packages-dir: dist
                  attestations: true
