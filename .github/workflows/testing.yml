name: Smoke Testing, Unit Testing, and Code Coverage

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    smoke-testing:
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: ${{ matrix.shell }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                include:
                    - os: ubuntu-latest
                      shell: bash
                    - os: windows-latest
                      shell: pwsh
                    - os: macos-latest
                      shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install Eigen on Ubuntu
              if: matrix.os == 'ubuntu-latest'
              run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

            - name: Install Eigen on macOS
              if: matrix.os == 'macos-latest'
              run: |
                  brew install eigen
                  echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)" >> "$GITHUB_ENV"

            - name: Install Eigen on Windows
              if: matrix.os == 'windows-latest'
              run: |
                  vcpkg install eigen3:x64-windows
                  "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

            - name: Install dependencies
              run: uv sync --group github

            - name: Run smoke tests
              run: uv run pytest -m smoke

    unit-testing:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install Eigen
              run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

            - name: Install dependencies
              run: uv sync --group github

            - name: Run tests
              run: uv run pytest  -m unit

    code-coverage:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install Eigen
              run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

            - name: Install dependencies
              run: uv sync --group github

            - name: Run tests with coverage
              run: uv run pytest --cov=respondpy --cov-report=term-missing --cov-report=xml tests
