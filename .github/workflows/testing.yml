name: Smoke Testing, Unit Testing, and Code Coverage

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    smoke-testing:
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: ${{ matrix.shell }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                include:
                    - os: ubuntu-latest
                      shell: bash
                    - os: windows-latest
                      shell: pwsh
                    - os: macos-latest
                      shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: uv sync --group github

            - name: Run smoke tests
              run: uv run pytest -m smoke

    unit-testing:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: uv sync --group github

            - name: Run tests
              run: uv run pytest  -m unit

    code-coverage:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.11"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: uv sync --group github

            - name: Run tests with coverage
              run: uv run pytest --cov=respondpy --cov-report=term-missing --cov-report=xml tests
