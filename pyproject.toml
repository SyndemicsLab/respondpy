[build-system]
requires = ["scikit-build-core>=0.11", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "respondpy"
version = "0.1.2"
description = "The Syndemic Lab's RESPOND Simulation Python Extension Module."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Matthew Carroll", email = "Matthew.Carroll@bmc.org" },
    { name = "Dimitri Baptiste", email = "Dimitri.Baptiste@bmc.org" },
]
maintainers = [{ name = "Syndemics Lab", email = "Benjamin.Linas@bmc.org" }]
keywords = ["simulation", "Opioid Use Disorder", "Syndemics"]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
dependencies = [
    "numpy",
    "polars>=1.37.1",
    "pytest-cov>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/SyndemicsLab/respond"
Issues = "https://github.com/SyndemicsLab/respond/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.exclude = []
logging.level = "INFO"
cmake.build-type = "Release"
messages.after-success = "{green}Wheel successfully built"
messages.after-failure = """
{bold.red}Sorry{normal}, build failed. Your platform is {platform.platform}.
"""

[dependency-groups]
dev = [
    { include-group = "test" },
    "ipykernel",
    "nbconvert",
    "polars>=1.37.1",
    "pybind11-stubgen>=2.5.5",
    "pytest>=9.0.2",
    "setuptools_scm",
    "typer",
    "uhi",
]
docs = [
    "ipython",
    "myst_parser>=0.13",
    "nbsphinx",
    "numpy",
    "sphinx-book-theme>=0.0.33",
    "sphinx>=4.0",
    "sphinx_copybutton",
]
examples = []
test = [
    "cloudpickle",
    "pytest-benchmark",
    "pytest>=6.0",
    "pytest-benchmark",
    "numpy",
    "hypothesis>=6.0; sys_platform != 'ios'", # slow on iOS, can fail health check
    "pytest-xdist; sys_platform != 'ios'",  # No processes on iOS
]
github = [
  { include-group = "test" },
  "setuptools_scm",
  "pytest-github-actions-annotate-failures"
]

[[tool.scikit-build.generate]]
path = "respondpy/version.py"
template = '''
__version__ = version = "$version"
'''

[tool.setuptools_scm]

[tool.uv.pip]
only-binary = ["numpy"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
minversion = "6.0"
junit_family = "xuint2"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
filterwarnings = [
    "error",
    "default:could not create cache path:pytest.PytestCacheWarning",
]
xfail_strict = true
testpaths = ["tests"]
required_plugins = ["pytest-benchmark"]
log_level = "DEBUG"
markers = [
    "smoke: Marks tests as smoke tests to respond import accuracy.",
    "unit: Marks tests as unit tests to verify basic functionality."
]

[tool.mypy]
python_version = 3.12
files = ["src"]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["typer"]
ignore_missing_imports = true

[tool.cibuildwheel]
build-frontend = "build[uv]"
test-groups = ["test"]
test-command = "python -m pytest -n auto --benchmark-disable tests"
test-sources = ["pyproject.toml", "tests"]
test-skip = [
  "cp310-win_arm64",
  "cp310-musllinux_*",
  "pp310-manylinux_aarch64",
  "pp310-macosx_arm64",
  "cp31*-musllinux_*", # Threading test crashes
  "cp313*",  # polars-runtime-32 lacks wheels for 3.13 and 3.14
  "cp314*",
  "pp*",  # polars-runtime-32 unsupported on PyPy 3.11 (pp73)
  "gp311_242-macosx_x86_64",
  "gp311_242-manylinux_aarch64",
  "gp311_242-win*",  # pytest crashes with module 'io' has no attribute '_WindowsConsoleIO'
  "gp312_*",  # No numpy wheels yet
  "cp314*-ios_*",  # No numpy wheels yet
]
enable = ["cpython-freethreading", "pypy"]
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION"]
environment.PIP_ONLY_BINARY = "numpy"
environment.PIP_PREFER_BINARY = "1"
environment.UV_ONLY_BINARY = "numpy"
environment.UV_PREFER_BINARY = "1"

[tool.cibuildwheel.pyodide]
build-frontend = {name = "build", args = ["--exports", "whole_archive"]}
test-command = "pytest --benchmark-disable tests"

[tool.cibuildwheel.ios]
build-frontend = "build"
xbuild-tools = ["cmake", "ninja"]
test-command = "python -m pytest --benchmark-disable tests"
environment.PIP_EXTRA_INDEX_URL = "https://pypi.anaconda.org/beeware/simple/"

[[tool.cibuildwheel.overrides]]
select = "pp310-macosx_arm64"
inherit.environment = "append"
environment.MACOSX_DEPLOYMENT_TARGET = "14.0"

[[tool.cibuildwheel.overrides]]
select = ["gp*"]
inherit.environment = "append"
environment.UV_INDEX = "https://www.graalvm.org/python/wheels/"
environment.UV_INDEX_STRATEGY = "unsafe-best-match"
test-command = "pytest --benchmark-disable tests"

[tool.coverage.run]
omit = [
    "src/respondpy/test.py",
    "tests/*"
]

[tool.pylint]
py-version = "3.12"
ignore-patterns = ['.*\.pyi']
ignore = "version.py"
extension-pkg-allow-list = ["respondpy._core"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "cyclic-import", # TODO: move files out of _internal
  "fixme",
  "invalid-name",
  "line-too-long",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "c-extension-no-member", # C extensions mess with this
  "protected-access",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-lines",
  "too-many-locals",
  "too-many-return-statements",
  "too-many-statements",
  "too-many-positional-arguments",
  "wrong-import-position",
  "unused-argument", # Covered by ruff
  "unsubscriptable-object", # Wrongly triggered
]

[tool.ruff.lint]
extend-select = [
  "ARG",         # flake8-unused-arguments
  "B",           # flake8-bugbear
  "C4",          # flake8-comprehensions
  "EXE",         # flake8-executable
  "FURB",        # refurb
  "G",           # flake8-logging-format
  "I",           # isort
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "PD",          # pandas-vet
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "PYI",         # flake8-pyi
  "TID251",      # flake8-tidy-imports.banned-api
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
]
ignore = [
  "PLR09",          # Too many X
  "PLR2004",        # Magic value in comparison
  "PT013",          # from pytest import approx is fine
  "PT011",          # pytest.raises too broad
  "PYI034",         # We are returning Self, just generic
]
typing-modules = ["respondpy._compat.typing"]
isort.required-imports = ["from __future__ import annotations"]
exclude = ["extern/*"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Self".msg = "Use respondpy._compat.typing.Self instead."
"typing_extensions.Self".msg = "Use respondpy._compat.typing.Self instead."

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["T20"]
"examples/*" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
"notebooks/*" = ["T20"]
"*.pyi" = ["F401", "TID251"]
"docs/conf.py" = ["ARG001"]
"src/respondpy/test.py" = ["PT"]
"**.ipynb" = ["I002", "E731"]
"src/respondpy/_compat/**.py" = ["TID251"]
